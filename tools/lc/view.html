<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #6b7d8c;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'
      const params = new URLSearchParams(location.search)
      const file = params.get('file') ?? 'fox.glb'
      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(innerWidth, innerHeight)
      document.body.appendChild(renderer.domElement)
      const scene = new THREE.Scene()
      scene.add(new THREE.HemisphereLight('#ffffff', '#555544', 2.2))
      const sun = new THREE.DirectionalLight('#fff3e0', 2.5)
      sun.position.set(3, 5, 4)
      scene.add(sun)
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(3, 48),
        new THREE.MeshStandardMaterial({ color: '#4c5a3a' }),
      )
      ground.rotation.x = -Math.PI / 2
      scene.add(ground)
      const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100)
      const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(file)
      scene.add(gltf.scene)
      const box = new THREE.Box3().setFromObject(gltf.scene)
      const size = box.getSize(new THREE.Vector3()),
        center = box.getCenter(new THREE.Vector3())
      const dist = Math.max(size.x, size.y, size.z) * 2.2
      const view = params.get('view') ?? 'side'
      const dir =
        view === 'front' ? new THREE.Vector3(0, 0.35, 1) : new THREE.Vector3(1, 0.35, 0.25)
      camera.position.copy(center).addScaledVector(dir.normalize(), dist)
      camera.lookAt(center)
      const mixer = new THREE.AnimationMixer(gltf.scene)
      window.info = {
        size: size.toArray(),
        anims: gltf.animations.map((a) => `${a.name}:${a.duration.toFixed(2)}`),
      }
      window.pose = (name, t) => {
        mixer.stopAllAction()
        const clip = gltf.animations.find((a) => a.name === name)
        if (clip) {
          const act = mixer.clipAction(clip)
          act.play()
          mixer.setTime(t)
        }
        renderer.render(scene, camera)
      }
      window.pose(null, 0)
      window.ready = true
    </script>
  </body>
</html>
